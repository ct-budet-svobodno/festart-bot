<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}ФЕСТАРТ{% endblock %} · админка</title>
<link rel="stylesheet" href="/static/admin.css?v={{ asset_v() }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark"></span> ФЕСТАРТ</a>
    <div style="margin-left:auto">
      <a class="btn btn-sm" href="/logout">Выйти</a>
    </div>
  </div>
  <nav class="nav">
    <a href="/" class="{{ 'on' if active == 'dashboard' }}">Сводка</a>
    <a href="/activities?kind=zone" class="{{ 'on' if active == 'activities' }}">Зоны и МК</a>
    <a href="/prizes" class="{{ 'on' if active == 'prizes' }}">Призы</a>
    <a href="/participants" class="{{ 'on' if active == 'participants' }}">Участники</a>
    <a href="/staff" class="{{ 'on' if active == 'staff' }}">Организаторы</a>
    <a href="/settings" class="{{ 'on' if active == 'settings' }}">Настройки</a>
  </nav>
</header>

<main class="wrap">
{% block content %}{% endblock %}
</main>

</body>
</html>
