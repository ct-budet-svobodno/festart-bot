# Один сервис: бот сам ходит в Telegram, наружу ничего не слушает.
# База — SQLite: писатель ровно один, отдельный Postgres был бы лишним
# контейнером и лишней памятью на общем сервере.

services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Абсолютный путь: WORKDIR внутри образа — /app.
      DATABASE_URL: sqlite+aiosqlite:////app/data/festart.db
    volumes:
      # Каталогами, а не томами: базу и загрузки видно с хоста,
      # резервная копия сводится к копированию файла.
      - ./data:/app/data
      - ./media:/app/media

    # Потолок памяти: на сервере живут чужие проекты, и наш контейнер
    # при любой ошибке не должен отъедать память у соседей.
    mem_limit: 512m

    # По умолчанию Docker пишет логи без ограничения и за месяцы
    # съедает диск. Тридцать мегабайт на нас более чем достаточно.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: python -m app.bot.main
