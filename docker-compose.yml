services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: festart
      POSTGRES_USER: festart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festart"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://festart:${POSTGRES_PASSWORD}@db:5432/festart
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.bot.main


volumes:
  pgdata:
